# Draft until the lock on 2026-10-28. At the lock this file is frozen by the
# lock tag and check_claim.py refuses any run whose config hash differs.
version: draft
seeds:
  dev_train: [1000, 1001, 1002, 1003, 1004]
  dev_val: [2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009,
            2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019]
  final_eval: null          # generated and held by the separate session
  calibration: [4000, 4001, 4002, 4003, 4004, 4005, 4006, 4007, 4008, 4009,
                4010, 4011, 4012, 4013, 4014, 4015, 4016, 4017, 4018, 4019]
  coverage:                 # dev-val sub-range for the coverage study: pools and replications, disjoint from every other range
    start: 3000000
    block: 600000           # seeds reserved per selected cell: pool + replications, with room for both doublings
    pool: 35000
    replications: {"10": 2000, "20": 2000, "40": 4000}
    n_grid: [10, 20, 40]
market:
  N: 10
  J: 50
  T: 200
  sigma: 0.05
  e: 0.0
  v_min: 0.6
  v_max: 1.4
  providers:                # spec 3 provider table; k = 6 for every provider
    q_max: [0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 1.00, 1.00]
    a:     [0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02, 0.02]
    b:     [0.40, 0.38, 0.36, 0.34, 0.32, 0.30, 0.28, 0.26, 0.24, 0.22]
    k:     [6, 6, 6, 6, 6, 6, 6, 6, 6, 6]
admissible:
  L_max: 50
  H_max: 3
beta_grid: [0.0, 0.01, 0.02, 0.05, 0.10, 0.20]
beta_headline: 0.05
rho:
  default: 0.2
  sweep: [0.05, 0.2, 1.0]
search:
  popsize: 8
  sigma0: 0.3
  restarts: 5
  evals_per_restart: 300
  reeval_every: 10
  sobol_seed: 20261028
  near_corner: 0.02
reference_order: [abstain, honest_max, twin_search, attack_projection, archive_clip1, archive_truthful_clip0, bank]
tuning:
  price_f: [0.5, 0.7, 0.9]
  tol: [0.08, 0.12, 0.16]
  L: [10, 20, 50]
  inner_restarts: 1
  inner_evals: 100
  inner_seeds: 3
  recheck_top: 3
  recheck_namespace: dev_val
tuned: null                 # at the lock, the lock tooling (plan 2B) lists experiments/tuned/tuned_<rule>.json with sha256 here
identity_salt_sha256: null  # at the lock, the separate session commits the SHA-256 of the final salt here; the salt itself is released with the sealed bundle
positions: [low, median, high]
doubling_cells: [[D1, median], [D2, median]]     # per rule, at beta_headline and rho default
no_ban_rules: [B2, B3]
all_deviators:
  sweeps: 3
  restarts: 1
  evals: 100
  seeds: 3
intervals:
  bootstrap_resamples: 10000
  bootstrap_seed: 20261111
  h1_repetitions: 10
  reference_level: 0.95
  margins: {"0.95": 2.0, "0.9875": 1.0}       # coverage points below the analytic threshold, per level
  deficits: {"0.95": 3.0, "0.9875": 1.5}      # negative-control coverage deficit the gate must detect, per level
  joint_trials: 200
  joint_min_admitted: 190
  joint_level: 0.9833333333                    # 1 - 0.05 / 3: at most three attempts
  quadrature_nodes: 200
  remedy_order: [percentile, studentized, studentized_n40]
h1:
  model: claude-opus-5-5                       # pinned snapshot id; the sealed prompt is the custodian's
  jev_model: jev-1.14.0
  T: 100
  episodes: 5
  repetitions: 10
  betas: [0.02, 0.05, 0.10]
  fallback_limit: 0.05
  invalid_limit: 2
  calls_cap: 192000
  cost_cap_usd: null                           # set at the lock from the token pilot
  prices:                                      # USD per million tokens, used by the token pilot and the cost cap (cache writes and reads priced separately)
    claude-opus-5-5: {input: 4.0, output: 20.0, cache_write: 5.0, cache_read: 0.4}
    jev-1.14.0: {input: 0.042, output: 0.0}
claim:
  beta: 0.05
  eff_min: 0.90
  gain_max: 0.30
  loss_diff_min: 0.05
  baseline_gain_min: 1.0
  rule_level: 0.95
  baseline_level: 0.9875
allow_list: [sim/mechanisms/proposed.py, experiments/proposed.yaml, experiments/proposed_describe.yaml, experiments/cache/h1/, scripts/plot.py, docs/, sealed/, sealed/patches/]
calibration: null                              # written by scripts/lock.py from experiments/calibration.json
sealed_bundle_sha256: null                     # written by scripts/lock.py from the custodian's hash
coverage_report_sha256: null                   # written by scripts/lock.py
comprehension_fixture_sha256: null             # written by scripts/lock.py
