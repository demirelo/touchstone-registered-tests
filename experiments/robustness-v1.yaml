# Doubling checks on fixed cells (never selected by outcomes): R3 and B3 under D2+H3 at the median position of every non-headline variant.
doubling: {rules: [proposed, B3], family: D2+H3, position: median, variants: [beta0.02, beta0.10, rho0.05, rho1, N5J25, N20J100, J25, J60, sigma0.025, sigma0.10, eta0.1, eta1, eta10, T100, T400]}
diagnostics: {betas: [0.02, 0.05, 0.10], rules: [B2, B3, proposed], deltas: [0.0, 0.08, 0.16, 0.24], plans: [reset, wait], seeds: dev_val_20, total: 72}
predictions:
  budget: "B2 and B3 keep large D2+H3 gains at every budget (the ban is bypassable; Corollary 1). R3's D2+H3 gain falls as beta rises; at beta 0.02 the early quota (2 or 3 audits) is below one entrant's six jobs, the priority phase overloads (Lemma 2), and R3's gain moves toward B3's. D2 gains fall with beta for every audited rule. The R3 advantage over B2 and B3 persists at the low and high positions with different magnitudes."
  audit_cost: "rho 1 cuts the allowance fivefold (quota about 2): like beta 0.02, R3's H3 protection weakens. rho 0.05 quadruples the quota: R3's H3 gain near zero."
  scale: "The quota scales with J (the allowance is proportional to n_FB) while an entrant's demand stays 6 jobs: N5J25 (quota about 5) overloads with one entrant and weakens R3; N20J100 (quota about 20) strengthens it. Type composition also changes."
  load: "J25 at N 10: quota about 5 < 6, R3 weaker; J60: stronger. Payments and service counts change; results are read through the measured coverage."
  noise: "sigma 0.10 raises honest false failures (d0 = Phi(-1.6) = 0.055): efficiency falls for every audited rule, most for R3 whose fresh identities are audited in full; sigma 0.025 sharpens detection and lowers D2 gains."
  entry_cost: "A positive entry charge makes every reset costly: B2 and B3 D2+H3 gains fall toward their D2 gains as eta rises, and R3's advantage shrinks; at eta 10 the rules differ little under D2+H3. Optimisation and waiting prevent a monotonicity theorem; this is a hypothesis."
  horizon: "T 100: the terminal reserve takes a larger share of the allowance and the early quota is smaller: R3 weaker. T 400: stronger. Boundary effects matter more at T 100."
  timing_aging: "As in docs/exploratory/2026-10-20-predictions.md items 2 to 4: X1 and X2 about the D2+H3 level against B2 and B3, about 0.04 to 0.07 against R3; X3 avoids R3's terminal window; X5 near 0.05 to 0.10 against R3, since a replacement stays first in the newest-first targeting (Lemma 2b)."
  fresh_congestion: "Synchronised entrants at c 2 and 5 overload R3's priority quota and raise the focal gain above c 1 (c 2: 0.10 to 0.20; c 5: 0.20 to 0.35); staggered schedules with the same reset count give lower gains than synchronised ones; B2 and B3 do not depend on c."
  diagnostics: "Under R3 at beta 0.05 and 0.10, replacement identities past the fresh window face an audit rate of at least 5/6 (Lemma 2b) and initial identities far less; the renewal bound (5) holds wherever its gate admits it; many R3 configurations are inadmissible (mixed generation classes), which is itself the finding that the stationary renewal model does not describe R3."
disclosures:
  - "Before this file was committed, the theorem-check tests ran FixedShade(0.24, reset) against R3 on dev-val seeds 2000 to 2002 and printed the established audit rates (replacement 0.92 to 0.94 of jobs, initial 0.03 to 0.17). No other diagnostic or robustness outcome had been produced."
  - "A pilot pod is running the four headline X1 cells with the earlier exploratory runner to measure cost; its outcomes are not read before this file is committed and are reported as a separate record."
  - "The 32-cell headline exploratory run is folded into this design (the timing, aging, X4, and X6 cells are here, X6 with searched staggered profiles); the exploratory predictions file applies to these cells."
  - "The robustness tests ran smoke-budget cells (1 restart x 16 evaluations, 1 training seed, 2 evaluation seeds) on the headline, beta0.02, sigma0.10, eta1, and N5J25 variants for B3 to exercise the code; their numbers were not read and are not results."
  - "Pilot timing read before commit: about 25 minutes per headline search cell on one core (two of the four X1 search records existed; their contents were not read)."
